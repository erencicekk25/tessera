name: tessera

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Issuer: tessera-identity
  Jwt__Audience: tessera-clients
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-compose-signing-key-please-override-0123456789}
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:-tessera}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-tessera}
  Swagger__Enabled: "true"

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tessera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tessera}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tessera}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tessera}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tessera}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- services
  wallet-api:
    build:
      context: .
      dockerfile: src/Services/Wallet.Service/Wallet.Api/Dockerfile
    environment:
      <<: *dotnet-env
      ConnectionStrings__WalletDb: Host=postgres;Port=5432;Database=tessera_wallet;Username=${POSTGRES_USER:-tessera};Password=${POSTGRES_PASSWORD:-tessera}
      ConnectionStrings__Redis: redis:6379
    ports: ["5101:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: on-failure

  scoring-api:
    build:
      context: .
      dockerfile: src/Services/Scoring.Service/Scoring.Api/Dockerfile
    environment:
      <<: *dotnet-env
      ConnectionStrings__ScoringDb: Host=postgres;Port=5432;Database=tessera_scoring;Username=${POSTGRES_USER:-tessera};Password=${POSTGRES_PASSWORD:-tessera}
    ports: ["5102:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: on-failure

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: tessera-identity
      Jwt__Audience: tessera-clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-compose-signing-key-please-override-0123456789}
      ReverseProxy__Clusters__wallet__Destinations__primary__Address: http://wallet-api:8080
      ReverseProxy__Clusters__scoring__Destinations__primary__Address: http://scoring-api:8080
      Cors__AllowedOrigins__0: http://localhost:4200
      Cors__AllowedOrigins__1: http://localhost:8080
    ports: ["5000:8080"]
    depends_on: [wallet-api, scoring-api]
    restart: on-failure

  # ---------------------------------------------------------------- frontend
  web:
    build:
      context: frontend/tessera-web
    ports: ["8080:80"]
    depends_on: [gateway]

volumes:
  postgres-data:
